services:
  database:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: enterprise
      POSTGRES_USER: enterprise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterprise -d enterprise"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  enterprise:
    build:
      context: .
      dockerfile: enterprise/Dockerfile
    environment:
      DATABASE_URL: postgresql://enterprise:${POSTGRES_PASSWORD}@database:5432/enterprise
      ENTERPRISE_ENCRYPTION_KEY: ${ENTERPRISE_ENCRYPTION_KEY:?Set encryption key}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:?Set bootstrap token}
    volumes:
      - enterprise-data:/data
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  gateway:
    image: caddy:2-alpine
    environment:
      ENTERPRISE_DOMAIN: ${ENTERPRISE_DOMAIN:-workbench.internal}
    ports:
      - "443:443"
    volumes:
      - ./enterprise/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      enterprise:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
  enterprise-data:
  caddy-data:
  caddy-config:
