<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>多子工作台可视化原型（静态示例）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2307529e'/%3E%3Crect x='3' y='4' width='3' height='8' fill='white' opacity='.92'/%3E%3Crect x='8' y='7' width='3' height='5' fill='white' opacity='.6'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f6f9;--panel:#ffffff;--ink:#1f2d3d;--muted:#5a7186;--line:#d8e1ea;
  --blue:#07529e;--blue-bg:#e8f1fc;--green:#0a7a52;--green-bg:#eff9f4;
  --gold:#8a5a00;--gold-bg:#fdf6e8;--purple:#7a4fa3;--purple-bg:#f5effb;
  --red:#b04a3a;--red-bg:#fdf0ee;--gray:#6b7a8d;--gray-bg:#eef2f6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","Segoe UI",system-ui,sans-serif;font-size:13.5px;line-height:1.55}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 18px 10px}
.brand{font-size:16px;font-weight:700}.brand .sub{font-size:12px;color:var(--muted);font-weight:400;margin-left:10px}
.nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;align-items:center}
.nav-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav-label{font-size:12px;color:var(--muted);margin-right:2px}
.nav button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:16px;padding:4px 12px;cursor:pointer;font-size:12.5px}
.nav button.active{background:var(--blue);border-color:var(--blue);color:#fff}
main{max-width:1280px;margin:14px auto;padding:0 16px 40px}
.notice{background:var(--gold-bg);border:1px solid #e6cf9c;color:var(--gold);border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:12px}
.meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.badge{display:inline-block;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:600}
.meta .flowid{font-family:Consolas,monospace;font-size:12px;color:var(--muted)}
.meta .desc{flex-basis:100%;color:var(--muted);font-size:12.5px}
.chain{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.chain-title,.sec-title{font-size:13px;font-weight:700;margin-bottom:8px}
.chain-flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.node{border-radius:8px;padding:5px 10px;font-size:12.5px;border:1px solid transparent;white-space:nowrap}
.node .k{font-size:11px;opacity:.85;display:block}
.arrow{color:var(--muted)}
.k-start,.k-end{background:var(--gray-bg);color:var(--gray)}
.k-ai{background:var(--blue-bg);color:var(--blue)}
.k-human{background:var(--green-bg);color:var(--green)}
.k-approval{background:var(--gold-bg);color:var(--gold)}
.k-parallel,.k-join{background:var(--purple-bg);color:var(--purple)}
.k-condition{background:var(--red-bg);color:var(--red)}
.pluginbar{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pb-label{font-size:12.5px;font-weight:700;margin-right:4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 12px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue);font-weight:600}
.chip .t{font-size:11px;color:var(--muted);margin-left:4px}
.grid{display:grid;grid-template-columns:1.3fr .9fr;gap:12px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:280px}
.card{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:10px;background:#fff}
.card.active{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue-bg)}
.card-head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card-title{font-weight:600}
.st{font-size:11.5px;border-radius:10px;padding:1px 9px;white-space:nowrap}
.st-todo{background:var(--gray-bg);color:var(--gray)}
.st-doing{background:var(--blue-bg);color:var(--blue)}
.st-done{background:var(--green-bg);color:var(--green)}
.st-overdue{background:var(--red-bg);color:var(--red)}
.st-rework{background:var(--gold-bg);color:var(--gold)}
.st-pending{background:var(--purple-bg);color:var(--purple)}
.meta-line{color:var(--muted);font-size:12px;margin:4px 0}
.accept{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted)}
.btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:12.5px;cursor:pointer;margin-top:8px}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.dash-card{display:flex;justify-content:space-between;gap:10px;align-items:center}
.dash-metric{font-size:13px;font-weight:700;color:var(--blue)}
.chat{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fbfdff;height:260px;overflow:auto}
.msg{margin-bottom:10px;max-width:92%}
.msg.ai{color:var(--ink)}.msg.me{margin-left:auto;text-align:right}
.bubble{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 10px;text-align:left;font-size:12.5px}
.msg.me .bubble{background:var(--blue-bg);border-color:#bcd8f2}
.chat-input{display:flex;gap:8px;margin-top:10px}
.chat-input input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.type{font-size:11.5px;border-radius:10px;padding:1px 9px;background:var(--gray-bg);color:var(--gray)}
.pf{display:grid;grid-template-columns:160px 1fr;gap:6px 14px;font-size:12.5px;margin:8px 0}
.pf dt{color:var(--muted)}
.pf dd{margin:0}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left}
th{background:var(--gray-bg);font-weight:600}
.tbl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px}
.landing{font-size:12px;color:var(--muted)}
#toast{position:fixed;right:16px;bottom:16px;background:#22303f;color:#fff;border-radius:8px;padding:9px 14px;font-size:12.5px;display:none}
.foot{color:var(--muted);font-size:12px;margin-top:16px}
@media(max-width:1000px){.grid{grid-template-columns:1fr}.pf{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">多子工作台 · 可视化原型<span class="sub">纯静态示例 · 数据均为占位 · 未连接后端 · 流程与字段对应《各工作台工作流详解.md》</span></div>
  <div id="nav" class="nav"></div>
</header>
<main>
  <div class="notice">布局约定：顶部为「插件快捷条」；主区左侧为待办/看板卡片、右侧为问答框；下方为选中插件的静态面板与该工作台插件配置清单。管理台左侧为管理看板，其余工作台左侧为个人待办。</div>
  <section class="meta" id="meta"></section>
  <section class="chain"><div class="chain-title">工作流示意（节点类型与顺序）</div><div class="chain-flow" id="chain"></div></section>
  <section class="pluginbar"><span class="pb-label">插件条：</span><div id="chips" style="display:flex;flex-wrap:wrap;gap:8px"></div></section>
  <section class="grid">
    <div class="col">
      <div class="sec-title" id="leftTitle">我的待办</div>
      <div id="todoList"></div>
    </div>
    <div class="col">
      <div class="sec-title">右侧问答框（任务问答 / 知识问答 / 个人对话）</div>
      <div class="chat" id="chat"></div>
      <div class="chat-input"><input placeholder="输入问题或指令（静态原型，不实际发送）"><button class="btn" onclick="toast('静态原型：发送不进入后端')">发送</button></div>
    </div>
  </section>
  <section class="panel" id="panel"></section>
  <section class="tbl"><div class="sec-title">本工作台插件配置清单</div><div id="pluginTable"></div></section>
  <div class="foot">说明：节点颜色 = 节点类型；状态颜色 = 任务状态；所有按钮不触发真实提交、保存或请求。</div>
</main>
<div id="toast"></div>

let activePlugin={};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',1800)}
function statusPill(s){const map={todo:['待办','st-todo'],doing:['进行中','st-doing'],done:['已完成','st-done'],overdue:['逾期','st-overdue'],rework:['退回','st-rework'],pending:['审批中','st-pending']};const m=map[s]||['待办','st-todo'];return '<span class="st '+m[1]+'">'+m[0]+'</span>'}
function renderNav(){
  const groups={管理层:['w1'],电商层:['w2','w3','w4'],执行层:['w5','w6','w7'],销售层:['w8','c1']};
  const hash=location.hash.replace('#','')||'w1';
  let html='';
  Object.keys(groups).forEach(g=>{html+='<div class="nav-group"><span class="nav-label">'+g+'</span>'+groups[g].map(id=>'<button data-id="'+id+'" class="'+(id===hash?'active':'')+'">'+esc(VIEWS[id].short)+'</button>').join('')+'</div>'});
  document.getElementById('nav').innerHTML=html;
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.id;render()});
}
function renderMeta(v){
  document.getElementById('meta').innerHTML=
    '<span class="badge" style="background:'+v.colorBg+';color:'+v.color+'">'+esc(v.layer)+'</span>'+

    '<span class="flowid">'+esc(v.flow)+'</span>'+
    '<div class="desc">'+esc(v.desc)+'</div>';
}
function renderChain(v){

}
function renderChips(v){
  const list=v.plugins;if(!activePlugin[v.id])activePlugin[v.id]=list[0].id;
  document.getElementById('chips').innerHTML=list.map(p=>'<button class="chip '+(activePlugin[v.id]===p.id?'on':'')+'" data-id="'+p.id+'">'+esc(p.name)+'<span class="t">'+TYPE_LABEL[p.type]+'</span></button>').join('');
  document.querySelectorAll('#chips .chip').forEach(b=>b.onclick=()=>{activePlugin[v.id]=b.dataset.id;render()});
}

  document.getElementById('leftTitle').textContent=v.dash?(v.dashTitle||'管理看板（受理 · 审批 · 督办 · 归档）'):'我的待办（首页主区，唯一操作入口）';

  else{html=v.todos.map((t,i)=>'<div class="card '+(i===0?'active':'')+'"><div class="card-head"><span class="card-title">'+esc(t.title)+'</span>'+statusPill(t.status)+'</div><div class="meta-line">期限：'+esc(t.due)+' · 交付物：'+esc(t.deliverable)+'</div><ul class="accept">'+t.accept.map(a=>'<li>'+esc(a)+'</li>').join('')+'</ul><button class="btn" onclick="toast(\'静态原型：提交后进度同步到管理台（不真实提交）\')">提交交付</button> <button class="btn ghost" onclick="toast(\'静态原型：AI 仅生成草稿，需本人确认\')">帮我起草</button></div>').join('')}

}

  const p=v.plugins.find(x=>x.id===activePlugin[v.id])||v.plugins[0];
  let rows='';
  if(p.rows){rows='<table><thead><tr>'+p.rows[0].map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+p.rows.slice(1).map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
  const fields=p.fields?('<dl class="pf">'+p.fields.map(f=>'<dt>'+esc(f[0])+'</dt><dd>'+esc(f[1])+'</dd>').join('')+'</dl>'):'';
  document.getElementById('panel').innerHTML='<div class="panel-head"><span class="card-title">插件面板：'+esc(p.name)+'</span><span class="type">'+TYPE_LABEL[p.type]+'</span><span class="landing">沉淀/去向：'+esc(p.landing)+'</span></div><div class="meta-line">'+esc(p.desc)+'</div>'+fields+rows+'<div class="meta-line" style="margin-top:8px">面板为静态占位：字段、记录行均为示例；落地形态见《各工作台工作流详解.md》第 1 节插件注册表。</div>';
}
function renderTable(v){
  document.getElementById('pluginTable').innerHTML='<table><thead><tr><th>插件 ID</th><th>名称</th><th>类型</th><th>用途</th><th>沉淀/去向</th></tr></thead><tbody>'+v.plugins.map(p=>'<tr><td>'+esc(p.id)+'</td><td>'+esc(p.name)+'</td><td>'+TYPE_LABEL[p.type]+'</td><td>'+esc(p.desc)+'</td><td class="landing">'+esc(p.landing)+'</td></tr>').join('')+'</tbody></table>';
}
function render(){const id=location.hash.replace('#','')||'w1';const v=VIEWS[id]||VIEWS.w1;renderNav();renderMeta(v);renderChain(v);renderChips(v);renderLeft(v);renderChat(v);renderPanel(v);renderTable(v)}
window.addEventListener('hashchange',render);render();
</script>
</body>
