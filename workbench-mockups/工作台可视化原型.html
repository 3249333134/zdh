<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>多子工作台 · 简洁原型（静态示例）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2307529e'/%3E%3Crect x='3' y='4' width='3' height='8' fill='white' opacity='.92'/%3E%3Crect x='8' y='7' width='3' height='5' fill='white' opacity='.6'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f8fa;--card:#ffffff;--ink:#22303f;--muted:#647789;--line:#e3e9ef;
  --blue:#0b5cab;--blue-bg:#eaf2fb;--green:#0a7a52;--green-bg:#ecf7f2;
  --gold:#8a5a00;--gold-bg:#fbf3e3;--purple:#7a4fa3;--purple-bg:#f4effb;
  --red:#b04a3a;--red-bg:#fbecea;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","Segoe UI",system-ui,sans-serif;font-size:13.5px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:14px 16px 36px}
header{background:var(--card);border-bottom:1px solid var(--line);margin-bottom:14px}
header .wrap{padding-bottom:0}
.topline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.title{font-size:15px;font-weight:700}
.wbname{font-size:15px;font-weight:700;color:var(--blue)}
.topline .sub{font-size:12px;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 12px}
.tab{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:15px;padding:4px 13px;font-size:12.5px;cursor:pointer}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.meta{margin-bottom:12px;font-size:12.5px;color:var(--muted)}
.meta-main{color:var(--ink);font-weight:600;margin-bottom:2px}
.flowbox{margin-bottom:12px}
details summary{cursor:pointer;font-size:12.5px;color:var(--muted);user-select:none}
.chain-list{margin:8px 0 0;padding-left:18px}
.chain-list li{margin:3px 0}
.ckind{color:var(--muted);font-size:12px;margin-left:6px}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px;margin-bottom:14px}
.col{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.col-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.col-head h3{font-size:13.5px;margin:0}
.hint{font-size:12px;color:var(--muted)}
.todo-row{display:flex;gap:12px;align-items:flex-start;padding:10px 2px;border-bottom:1px dashed var(--line)}
.todo-row:last-child{border-bottom:none}
.todo-main{flex:1;min-width:0}
.todo-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.todo-top b{font-size:13.5px}
.todo-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.mini{margin-top:4px;font-size:12.5px;color:var(--muted)}
.mini summary{color:var(--muted)}
.mini ul{margin:4px 0 0;padding-left:18px}
.st{font-size:11.5px;border-radius:10px;padding:1px 9px;white-space:nowrap}
.st-todo{background:#eef2f6;color:#5a6b7c}
.st-doing{background:var(--blue-bg);color:var(--blue)}
.st-done{background:var(--green-bg);color:var(--green)}
.st-overdue{background:var(--red-bg);color:var(--red)}
.st-rework{background:var(--gold-bg);color:var(--gold)}
.st-pending{background:var(--purple-bg);color:var(--purple)}
.mini-btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:5px 13px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.mini-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dash-tile{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff}
.dt-top{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.dt-m{color:var(--blue);font-size:12.5px;font-weight:600}
.dt-desc{font-size:12.5px;color:var(--muted);margin:4px 0 8px}
.chat{height:230px;overflow:auto;background:#fbfcfe;border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:10px}
.msg{margin-bottom:9px;max-width:94%}
.msg.me{margin-left:auto;text-align:right}
.bubble{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 10px;text-align:left;font-size:12.5px}
.msg.me .bubble{background:var(--blue-bg);border-color:#c4dcf2}
.chat-input{display:flex;gap:8px}
.chat-input input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px}
.focus{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.focus-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:8px;margin-top:8px}
.fcard{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fbfcfe}
.f-head{display:flex;gap:8px;align-items:center;margin-bottom:3px;flex-wrap:wrap}
.flevel{font-size:11px;border-radius:10px;padding:1px 9px;font-weight:600;white-space:nowrap}
.f-overdue{background:var(--red-bg);color:var(--red)}
.f-block{background:var(--purple-bg);color:var(--purple)}
.f-advice{background:var(--blue-bg);color:var(--blue)}
.f-draft{background:var(--green-bg);color:var(--green)}
.f-warn{background:var(--gold-bg);color:var(--gold)}
.f-title{font-weight:600;font-size:13px}
.f-reason{font-size:12.5px;color:var(--muted)}
.fcard .mini-btn{margin-top:7px;padding:4px 12px}
.routines{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.rrow{display:flex;gap:12px;align-items:flex-start;padding:8px 2px;border-top:1px dashed var(--line)}
.rrow:first-of-type{border-top:none}
.rmeta{width:190px;flex:none}
.rname{font-weight:600;font-size:13px}
.rtime{font-size:12px;color:var(--muted);margin-top:2px}
.rbadge{font-size:11px;border-radius:10px;padding:1px 9px;font-weight:600;margin-left:6px;white-space:nowrap}
.r-pending{background:var(--gold-bg);color:var(--gold)}
.r-adopted{background:var(--green-bg);color:var(--green)}
.rsummary{flex:1;min-width:0;font-size:12.5px;color:var(--ink)}
.routines .mini-btn{flex:none;margin-top:2px;padding:4px 12px}
.plugins{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px}
.tile{border:1px solid var(--line);background:#fbfcfe;border-radius:9px;padding:9px 11px;cursor:pointer;text-align:left}
.tile .tname{display:block;font-size:13px;font-weight:600}
.tile .ttype{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.tile.on{border-color:var(--blue);background:var(--blue-bg)}
.simple-panel{margin-top:10px;border:1px solid #cfe0f3;background:#f5f9fe;border-radius:9px;padding:10px 12px}
.panel-title{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.ptype{font-size:11.5px;border-radius:10px;background:#eef2f6;color:var(--muted);padding:1px 9px}
.pdesc{font-size:12.5px;color:var(--muted)}
.pf{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:12.5px;margin:8px 0}
.pf dt{color:var(--muted)}
.pf dd{margin:0}
.pland{font-size:12.5px;color:var(--muted);margin-top:6px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border:1px solid var(--line);padding:5px 9px;text-align:left}
th{background:#eef2f6}
.cfg{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.cfg summary{font-weight:600;font-size:13px;color:var(--ink)}
.cfg table{margin-top:10px}
#toast{position:fixed;right:16px;bottom:16px;background:#22303f;color:#fff;border-radius:8px;padding:9px 14px;font-size:12.5px;display:none}
@media(max-width:900px){.grid{grid-template-columns:1fr}.dash-grid{grid-template-columns:1fr}.pf{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="topline"><span class="title">企业工作台</span><span class="wbname" id="wbName"></span><span class="sub">静态示例 · 不连接后端 · 按钮不提交数据</span></div>
  <nav id="nav" class="tabs"></nav>
</div></header>
<main class="wrap">
  <div class="meta" id="meta"></div>
  <section class="flowbox"><details><summary>工作流说明（点开看节点顺序）</summary><ol id="chain" class="chain-list"></ol></details></section>
  <section class="focus" id="focusSec"></section>
  <section class="routines" id="routineSec"></section>
  <section class="grid">
    <div class="col">
      <div class="col-head"><h3 id="leftTitle">待办</h3><span class="hint">完成后点「提交」，进度同步到管理台</span></div>
      <div id="todoList"></div>
    </div>
    <div class="col">
      <div class="col-head"><h3>问答</h3><span class="hint">任务问答 / 知识问答</span></div>
      <div class="chat" id="chat"></div>
      <div class="chat-input"><input placeholder="输入问题（静态原型，不发送）"><button class="mini-btn primary" onclick="toast('静态原型：不实际发送')">发送</button></div>
    </div>
  </section>
  <section class="plugins">
    <div class="col-head"><h3>其他功能 · 插件</h3><span class="hint">点选插件查看用途与字段</span></div>
    <div id="chips" class="tile-grid"></div>
    <div id="panel"></div>
  </section>
  <details class="cfg"><summary>开发参考：本工作台插件配置清单</summary><div id="pluginTable"></div></details>
</main>
<div id="toast"></div>
<script>

let activePlugin={};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',1800)}
function statusPill(s){const map={todo:['待办','st-todo'],doing:['进行中','st-doing'],done:['已完成','st-done'],overdue:['逾期','st-overdue'],rework:['退回','st-rework'],pending:['审批中','st-pending']};const m=map[s]||['待办','st-todo'];return '<span class="st '+m[1]+'">'+m[0]+'</span>'}
function renderFocus(v,id){
  const arr=FOCUS[id]||[];
  document.getElementById('focusSec').innerHTML='<div class="col-head"><h3>今日建议</h3><span class="hint">AI 按紧急度汇总，仅建议；正式操作由本人确认</span></div><div class="focus-grid">'+arr.map(f=>{const m=FL[f.level]||FL.advice;return '<div class="fcard"><div class="f-head"><span class="flevel '+m[1]+'">'+m[0]+'</span><span class="f-title">'+esc(f.title)+'</span></div><div class="f-reason">'+esc(f.reason)+'</div><button class="mini-btn" onclick="toast(\'静态原型：'+esc(f.action)+'（不执行）\')">'+esc(f.action)+'</button></div>';}).join('')+'</div>';
}
function renderRoutines(v,id){
  const arr=ROUTINES[id]||[];
  const pending=arr.filter(x=>x.status==='pending').length;
  const title=id==='w1'?'定时任务总览 · AI 自动运行':'今日 AI 定时汇总';
  const hint=id==='w1'?'运行状态与待查看结果；手动运行仍生成待确认草稿':'到点自动生成；采用、转派、忽略均由人工确认';
  document.getElementById('routineSec').innerHTML='<div class="col-head"><h3>'+title+'</h3><span class="hint">'+hint+' · 待查看 '+pending+' 条</span></div>'+arr.map(r=>{const m=RLABEL[r.status]||RLABEL.pending;return '<div class="rrow"><div class="rmeta"><div class="rname">'+esc(r.name)+'</div><div class="rtime">'+esc(r.time)+'<span class="rbadge '+m[1]+'">'+m[0]+'</span></div></div><div class="rsummary">'+esc(r.summary)+'</div><button class="mini-btn" onclick="toast(\'静态原型：'+esc(r.action)+'（不自动提交）\')">'+esc(r.action)+'</button></div>';}).join('');
}
function renderNav(){
  const id=location.hash.replace('#','')||'w1';
  document.getElementById('nav').innerHTML=ORDER.map(x=>'<button class="tab'+(x===id?' on':'')+'" data-id="'+x+'">'+esc(VIEWS[x].short)+'</button>').join('');
  document.querySelectorAll('#nav .tab').forEach(b=>b.onclick=()=>{location.hash=b.dataset.id;render()});
}
function renderMeta(v){
  document.getElementById('wbName').textContent='· '+v.short;
  document.getElementById('meta').innerHTML='<div class="meta-main">'+esc(v.layer)+' · '+esc(v.role)+' · <span style="font-family:Consolas,monospace">'+esc(v.flow)+'</span></div><div>'+esc(v.desc)+'</div>';
}
function renderChain(v){
  document.getElementById('chain').innerHTML=v.chain.map(n=>'<li><b>'+esc(n.n)+'</b><span class="ckind">'+KIND_LABEL[n.k]+'</span></li>').join('');
}
function renderChips(v,id){
  const list=v.plugins;if(!activePlugin[id])activePlugin[id]=list[0].id;
  document.getElementById('chips').innerHTML=list.map(p=>'<button class="tile '+(activePlugin[id]===p.id?'on':'')+'" data-id="'+p.id+'"><span class="tname">'+esc(p.name)+'</span><span class="ttype">'+TYPE_LABEL[p.type]+'</span></button>').join('');
  document.querySelectorAll('#chips .tile').forEach(b=>b.onclick=()=>{activePlugin[id]=b.dataset.id;render()});
}
function renderLeft(v){
  document.getElementById('leftTitle').textContent=v.dash?(v.dashTitle||'管理看板'):'派单待办 · 来自管理台';
  let html='';
  if(v.dash){
    html='<div class="dash-grid">'+v.dash.map(d=>'<div class="dash-tile"><div class="dt-top"><b>'+esc(d.name)+'</b><span class="dt-m">'+esc(d.metric)+'</span></div><div class="dt-desc">'+esc(d.desc)+'</div><button class="mini-btn" onclick="toast(\'静态原型：打开 '+esc(d.name)+'\')">打开</button></div>').join('')+'</div>';
  }else{
    html=v.todos.map(t=>'<div class="todo-row"><div class="todo-main"><div class="todo-top"><b>'+esc(t.title)+'</b>'+statusPill(t.status)+'</div><div class="todo-sub">期限 '+esc(t.due)+' · 交付：'+esc(t.deliverable)+'</div><details class="mini"><summary>验收要点</summary><ul>'+t.accept.map(a=>'<li>'+esc(a)+'</li>').join('')+'</ul></details></div><button class="mini-btn primary" onclick="toast(\'静态原型：提交后进度同步管理台（未真实提交）\')">提交</button></div>').join('');
  }
  document.getElementById('todoList').innerHTML=html;
}
function renderChat(v){
  document.getElementById('chat').innerHTML=v.chat.map(m=>'<div class="msg '+m.who+'"><span class="bubble">'+esc(m.text)+'</span></div>').join('');
  document.getElementById('chat').scrollTop=9999;
}
function renderPanel(v,id){
  const p=v.plugins.find(x=>x.id===activePlugin[id])||v.plugins[0];
  const fields=p.fields?('<dl class="pf">'+p.fields.map(f=>'<dt>'+esc(f[0])+'</dt><dd>'+esc(f[1])+'</dd>').join('')+'</dl>'):'';
  const rows=p.rows?'<table><thead><tr>'+p.rows[0].map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+p.rows.slice(1).map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'';
  document.getElementById('panel').innerHTML='<div class="panel-title"><b>'+esc(p.name)+'</b><span class="ptype">'+TYPE_LABEL[p.type]+'</span></div><div class="pdesc">'+esc(p.desc)+'</div>'+fields+rows+'<div class="pland">沉淀去向：'+esc(p.landing)+'</div>';
}
function renderTable(v){
  document.getElementById('pluginTable').innerHTML='<table><thead><tr><th>插件 ID</th><th>名称</th><th>类型</th><th>用途</th><th>沉淀去向</th></tr></thead><tbody>'+v.plugins.map(p=>'<tr><td>'+esc(p.id)+'</td><td>'+esc(p.name)+'</td><td>'+TYPE_LABEL[p.type]+'</td><td>'+esc(p.desc)+'</td><td>'+esc(p.landing)+'</td></tr>').join('')+'</tbody></table>';
}
function render(){const id=location.hash.replace('#','')||'w1';const v=VIEWS[id]||VIEWS.w1;renderNav();renderMeta(v);renderChain(v);renderFocus(v,id);renderRoutines(v,id);renderChips(v,id);renderLeft(v);renderChat(v);renderPanel(v,id);renderTable(v)}
window.addEventListener('hashchange',render);render();
</script>
